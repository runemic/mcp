# Builds the local MCP server and runs tests/mcp_test.mjs against a stand-in API (no account or network needed).
name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick poppler-utils >/dev/null
      - run: npm install --no-audit --no-fund --silent && npm run build && npm test
